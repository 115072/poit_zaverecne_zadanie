<!doctype html>
<html>
  <head>
    <title>Garden Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: sans-serif;
        background: #f0f2f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      .window {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin: 10px;
        width: 95%;
        max-width: 600px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      #needle-moisture {
        transition: transform 0.5s;
        transform-origin: 100px 100px;
        stroke: blue;
        stroke-width: 4;
      }
      #needle-limit {
        transition: transform 0.5s;
        transform-origin: 100px 100px;
        stroke: red;
        stroke-width: 2;
        stroke-dasharray: 4;
      }
      .btn-pwr {
        background: #007bff;
        color: white;
        padding: 15px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
        font-weight: bold;
      }
      .btn-start {
        background: #28a745;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
      }
      .btn-stop {
        background: #dc3545;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
        display: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 5px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div class="window" style="background: #e3f2fd">
      <h2 id="hw-status">Hardvér: VYPNUTÝ</h2>
      <button id="pwrBtn" class="btn-pwr" onclick="toggleHW()">
        AKTIVOVAŤ HARDVÉR
      </button>
    </div>

    <div class="window">
      <h3>Nastavenia & Live</h3>
      Limit: <input type="number" id="limit-input" value="500" />
      <button onclick="updateLimit()">Uložiť</button>
      <p>Moisture: <b id="m-val">0</b> | Pump: <b id="p-stat">OFF</b></p>
      <canvas id="liveChart" height="150"></canvas>
      <button
        id="startBtn"
        class="btn-start"
        onclick="toggleMon(true)"
        style="margin-top: 10px"
      >
        Spustiť Monitoring
      </button>
      <button
        id="stopBtn"
        class="btn-stop"
        onclick="toggleMon(false)"
        style="margin-top: 10px"
      >
        Zastaviť Monitoring
      </button>
    </div>

    <div class="window">
      <h3>Tachometer</h3>
      <svg viewBox="0 0 200 120" width="250">
        <path
          d="M20,100 A80,80 0 0,1 180,100"
          fill="none"
          stroke="#ccc"
          stroke-width="20"
        />
        <line
          id="needle-limit"
          x1="100"
          y1="100"
          x2="100"
          y2="40"
          transform="rotate(-90)"
        />
        <line
          id="needle-moisture"
          x1="100"
          y1="100"
          x2="100"
          y2="30"
          transform="rotate(-90)"
        />
      </svg>
    </div>

    <div class="window">
      <h3>MySQL História</h3>
      <button onclick="loadSQL()">Obnoviť MySQL</button>
      <select
        id="sqlSel"
        onchange="loadSQLDetail()"
        style="width: 100%; margin: 10px 0"
      ></select>
      <table id="sqlTab">
        <thead>
          <tr>
            <th>Čas</th>
            <th>Vlhkosť</th>
            <th>Pumpa</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="window">
      <h3>.txt História</h3>
      <button onclick="loadTXT()">Obnoviť .txt</button>
      <select
        id="txtSel"
        onchange="loadTXTDetail()"
        style="width: 100%; margin: 10px 0"
      ></select>
      <table id="txtTab">
        <thead>
          <tr>
            <th>Čas</th>
            <th>Vlhkosť</th>
            <th>Pumpa</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      let hwActive = false;
      const ctx = document.getElementById("liveChart").getContext("2d");
      const chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: [],
          datasets: [
            { label: "Vlhkosť", data: [], borderColor: "blue" },
            {
              label: "Limit",
              data: [],
              borderColor: "red",
              borderDash: [5, 5],
            },
          ],
        },
        options: { animation: false, scales: { y: { min: 0, max: 1023 } } },
      });

      function toggleHW() {
        hwActive = !hwActive;
        fetch("/toggle_hardware", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: hwActive }),
        });
        document.getElementById("pwrBtn").innerText = hwActive
          ? "DEAKTIVOVAŤ HARDVÉR"
          : "AKTIVOVAŤ HARDVÉR";
        document.getElementById("hw-status").innerText = hwActive
          ? "Hardvér: AKTÍVNY"
          : "Hardvér: VYPNUTÝ";
        if (hwActive) setInterval(fetchLive, 1000);
        else location.reload();
      }

      function toggleMon(s) {
        fetch(s ? "/start_monitoring" : "/stop_monitoring", {
          method: "POST",
        }).then(() => {
          document.getElementById("startBtn").style.display = s
            ? "none"
            : "block";
          document.getElementById("stopBtn").style.display = s
            ? "block"
            : "none";
        });
      }

      function fetchLive() {
        fetch("/get_data")
          .then((r) => r.json())
          .then((data) => {
            document.getElementById("m-val").innerText = data.moisture;
            document.getElementById("p-stat").innerText = data.pump;
            document.getElementById("needle-moisture").style.transform =
              `rotate(${(data.moisture / 1023) * 180 - 90}deg)`;
            document.getElementById("needle-limit").style.transform =
              `rotate(${(data.limit / 1023) * 180 - 90}deg)`;
            chart.data.labels.push(new Date().toLocaleTimeString());
            chart.data.datasets[0].data.push(data.moisture);
            chart.data.datasets[1].data.push(data.limit);
            if (chart.data.labels.length > 20) {
              chart.data.labels.shift();
              chart.data.datasets[0].data.shift();
              chart.data.datasets[1].data.shift();
            }
            chart.update();
          });
      }

      function loadSQL() {
        fetch("/list_sessions")
          .then((r) => r.json())
          .then((data) => {
            let s = document.getElementById("sqlSel");
            s.innerHTML = "<option>-- Vyberte --</option>";
            data.forEach((x) => {
              s.innerHTML += `<option value="${x.id}">ID: ${x.id} | ${x.start_time}</option>`;
            });
          });
      }

      function loadSQLDetail() {
        fetch("/get_session_details/" + document.getElementById("sqlSel").value)
          .then((r) => r.json())
          .then((data) => {
            let b = document.querySelector("#sqlTab tbody");
            b.innerHTML = "";
            data.forEach((r) => {
              b.innerHTML += `<tr><td>${r.timestamp}</td><td>${r.moisture}</td><td>${r.pump_state}</td></tr>`;
            });
          });
      }

      function loadTXT() {
        fetch("/list_txt_sessions")
          .then((r) => r.json())
          .then((data) => {
            let s = document.getElementById("txtSel");
            s.innerHTML = "<option>-- Vyberte --</option>";
            data.forEach((x) => {
              s.innerHTML += `<option value="${x.index}">Riadok ${x.index} | ${x.date}</option>`;
            });
          });
      }

      function loadTXTDetail() {
        fetch("/get_txt_detail/" + document.getElementById("txtSel").value)
          .then((r) => r.json())
          .then((data) => {
            let b = document.querySelector("#txtTab tbody");
            b.innerHTML = "";
            data.readings.forEach((r) => {
              b.innerHTML += `<tr><td>${r.timestamp}</td><td>${r.moisture}</td><td>${r.pump}</td></tr>`;
            });
          });
      }

      function updateLimit() {
        fetch("/set_limit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            limit: document.getElementById("limit-input").value,
          }),
        });
      }
      window.onload = () => {
        loadSQL();
        loadTXT();
      };
    </script>
  </body>
</html>
