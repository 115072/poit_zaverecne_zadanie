<!doctype html>
<html>
  <head>
    <title>Dashboard s Históriou</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: sans-serif;
        background: #f0f2f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      .window {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin: 10px;
        width: 95%;
        max-width: 600px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      /* Original Gauge needles */
      #needle-moisture {
        transition: transform 0.5s;
        transform-origin: 100px 100px;
        stroke: blue;
        stroke-width: 4;
      }
      #needle-limit {
        transition: transform 0.5s;
        transform-origin: 100px 100px;
        stroke: red;
        stroke-width: 2;
        stroke-dasharray: 4;
      }

      .status-on {
        color: red;
        font-weight: bold;
      }
      .status-off {
        color: green;
        font-weight: bold;
      }

      .btn-start {
        background: #28a745;
        color: white;
        padding: 12px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
        font-size: 16px;
      }
      .btn-stop {
        background: #dc3545;
        color: white;
        padding: 12px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
        font-size: 16px;
        display: none;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 12px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 6px;
        text-align: left;
      }
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <!-- 1. SETTINGS WINDOW -->
    <div class="window">
      <h3>Nastavenia</h3>
      Limit: <input type="number" id="limit-input" value="500" />
      <button onclick="updateLimit()">Uložiť</button>
      <p>Pumpa: <span id="pump-status">--</span></p>
    </div>

    <!-- 2. GAUGE WINDOW -->
    <div class="window">
      <h3>Tachometer</h3>
      <svg viewBox="0 0 200 120" width="300">
        <path
          d="M20,100 A80,80 0 0,1 180,100"
          fill="none"
          stroke="#ccc"
          stroke-width="20"
        />
        <text x="10" y="115" font-size="8">0</text>
        <text x="175" y="115" font-size="8">1023</text>
        <line
          id="needle-limit"
          x1="100"
          y1="100"
          x2="100"
          y2="40"
          transform="rotate(-90)"
        />
        <line
          id="needle-moisture"
          x1="100"
          y1="100"
          x2="100"
          y2="30"
          transform="rotate(-90)"
        />
      </svg>
    </div>

    <!-- 3. LIVE GRAPH WINDOW -->
    <div class="window">
      <h3>Live Graf</h3>
      <canvas id="liveChart" height="150"></canvas>
      <div style="margin-top: 15px">
        <button
          id="startBtn"
          class="btn-start"
          onclick="toggleMonitoring(true)"
        >
          Spustiť Monitoring & Ukladanie
        </button>
        <button id="stopBtn" class="btn-stop" onclick="toggleMonitoring(false)">
          Zastaviť Monitoring
        </button>
      </div>
    </div>

    <!-- 4. DATABASE HISTORY WINDOW -->
    <div class="window">
      <h3>História z MySQL</h3>
      <button onclick="loadSessions()">Obnoviť zoznam sedení</button>
      <select id="sessionSelect" onchange="loadSessionDetails()">
        <option value="">-- Vyberte sedenie podľa ID a času --</option>
      </select>
      <div style="max-height: 250px; overflow-y: auto">
        <table id="historyTable">
          <thead>
            <tr>
              <th>Čas</th>
              <th>Vlhkosť</th>
              <th>Pumpa</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <script>
      let liveInterval = null;
      const ctx = document.getElementById("liveChart").getContext("2d");
      const chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: [],
          datasets: [
            { label: "Vlhkosť", data: [], borderColor: "blue", tension: 0.3 },
            {
              label: "Limit",
              data: [],
              borderColor: "red",
              borderDash: [5, 5],
              pointRadius: 0,
            },
          ],
        },
        options: { animation: false, scales: { y: { min: 0, max: 1023 } } },
      });

      function updateLimit() {
        fetch("/set_limit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            limit: document.getElementById("limit-input").value,
          }),
        });
      }

      function toggleMonitoring(start) {
        const url = start ? "/start_monitoring" : "/stop_monitoring";
        fetch(url, { method: "POST" }).then(() => {
          if (start) {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("stopBtn").style.display = "block";
            liveInterval = setInterval(fetchLive, 1000);
          } else {
            document.getElementById("startBtn").style.display = "block";
            document.getElementById("stopBtn").style.display = "none";
            clearInterval(liveInterval);
          }
        });
      }

      function fetchLive() {
        fetch("/get_data")
          .then((r) => r.json())
          .then((data) => {
            document.getElementById("pump-status").innerText = data.pump;
            document.getElementById("pump-status").className =
              data.pump === "ON" ? "status-on" : "status-off";

            const mDeg = (data.moisture / 1023) * 180 - 90;
            const lDeg = (data.limit / 1023) * 180 - 90;
            document.getElementById("needle-moisture").style.transform =
              `rotate(${mDeg}deg)`;
            document.getElementById("needle-limit").style.transform =
              `rotate(${lDeg}deg)`;

            const now = new Date().toLocaleTimeString();
            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(data.moisture);
            chart.data.datasets[1].data.push(data.limit);
            if (chart.data.labels.length > 20) {
              chart.data.labels.shift();
              chart.data.datasets[0].data.shift();
              chart.data.datasets[1].data.shift();
            }
            chart.update();
          });
      }

      function loadSessions() {
        fetch("/list_sessions")
          .then((r) => r.json())
          .then((data) => {
            const sel = document.getElementById("sessionSelect");
            sel.innerHTML = '<option value="">-- Vyberte sedenie --</option>';
            data.forEach((s) => {
              sel.innerHTML += `<option value="${s.id}">ID: ${s.id} | Start: ${s.start_time}</option>`;
            });
          });
      }

      function loadSessionDetails() {
        const sid = document.getElementById("sessionSelect").value;
        if (!sid) return;
        fetch("/get_session_details/" + sid)
          .then((r) => r.json())
          .then((data) => {
            const tbody = document.querySelector("#historyTable tbody");
            tbody.innerHTML = "";
            data.forEach((row) => {
              tbody.innerHTML += `<tr><td>${row.timestamp}</td><td>${row.moisture}</td><td>${row.pump_state}</td></tr>`;
            });
          });
      }

      window.onload = loadSessions;
    </script>
  </body>
</html>
