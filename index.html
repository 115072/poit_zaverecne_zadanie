<!doctype html>
<html>
  <head>
    <title>Arduino Graph</title>
    <!-- Include Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <h1>Moisture Control & Graph</h1>

    <div>
      <strong>Regulačný limit:</strong>
      <input type="number" id="limit-input" value="500" />
      <button onclick="updateLimit()">Nastaviť limit</button>
    </div>

    <hr />

    <!-- This is where the graph will live -->
    <div style="width: 80%; margin: auto">
      <canvas id="myChart"></canvas>
    </div>

    <hr />
    <p>Pump Status: <strong id="pump-status">--</strong></p>
    <button onclick="startStream()">Start Graphing</button>

    <script>
      // --- CHART SETUP ---
      const ctx = document.getElementById("myChart").getContext("2d");
      const maxDataPoints = 30; // How many points to show on the graph at once

      const myChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: [], // Time/Labels go here
          datasets: [
            {
              label: "Soil Moisture",
              data: [],
              borderColor: "rgb(75, 192, 192)",
              tension: 0.1,
              fill: false,
            },
            {
              label: "Regulation Limit",
              data: [],
              borderColor: "rgb(255, 99, 132)",
              borderDash: [5, 5], // Makes the limit line dashed
              pointRadius: 0, // Hides dots on the limit line
              fill: false,
            },
          ],
        },
        options: {
          scales: {
            y: { beginAtZero: true, max: 1024 }, // Arduino analog is 0-1023
          },
          animation: false, // Disabling animation makes it look smoother for live data
        },
      });

      // --- DATA FETCHING ---
      function updateLimit() {
        const val = document.getElementById("limit-input").value;
        fetch("/set_limit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ limit: val }),
        });
      }

      function startStream() {
        setInterval(fetchData, 1000);
      }

      function fetchData() {
        fetch("/get_reading")
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("pump-status").innerText = data.pump;

            // Add data to Chart
            const now = new Date().toLocaleTimeString();

            // 1. Add new label (time)
            myChart.data.labels.push(now);
            // 2. Add moisture value
            myChart.data.datasets[0].data.push(data.moisture);
            // 3. Add current limit line value
            myChart.data.datasets[1].data.push(data.limit);

            // Keep only the last X points so the graph doesn't get too squished
            if (myChart.data.labels.length > maxDataPoints) {
              myChart.data.labels.shift();
              myChart.data.datasets[0].data.shift();
              myChart.data.datasets[1].data.shift();
            }

            myChart.update();
          });
      }
    </script>
  </body>
</html>
