<!doctype html>
<html>
  <head>
    <title>Smart Garden Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f2f5;
        text-align: center;
        padding: 20px;
        color: #333;
      }

      .window {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin: 15px auto;
        width: 90%;
        max-width: 600px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      h2,
      h3 {
        margin-top: 0;
        color: #444;
      }

      .status-on {
        color: #dc3545;
        font-weight: bold;
      }
      .status-off {
        color: #28a745;
        font-weight: bold;
      }

      /* Tachometer Styling */
      .gauge-container {
        margin: 20px 0;
      }
      #needle-moisture {
        transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        transform-origin: 100px 100px;
        stroke: #007bff;
        stroke-width: 4;
        stroke-linecap: round;
      }
      #needle-limit {
        transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        transform-origin: 100px 100px;
        stroke: #dc3545;
        stroke-width: 2;
        stroke-dasharray: 4;
        stroke-linecap: round;
      }

      /* Controls */
      input[type="number"] {
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
        width: 80px;
        font-size: 16px;
      }

      .btn-container {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }
      button {
        flex: 1;
        padding: 12px;
        border-radius: 5px;
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: opacity 0.3s;
      }

      #btn-start {
        background: #28a745;
      }
      #btn-stop {
        background: #dc3545;
        display: none;
      } /* Hidden by default */
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      button:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <h2>Nastavenia Systému</h2>
      <div>
        <label>Regulačný limit: </label>
        <input type="number" id="limit-input" value="500" />
        <button
          onclick="updateLimit()"
          style="background: #007bff; width: auto; flex: none"
        >
          Uložiť
        </button>
      </div>
      <p>Stav pumpy: <span id="pump-status" class="status-off">OFF</span></p>
    </div>

    <div class="window">
      <h3>Tachometer Vlhkosti</h3>
      <div class="gauge-container">
        <svg viewBox="0 0 200 130" width="100%">
          <path
            d="M20,100 A80,80 0 0,1 180,100"
            fill="none"
            stroke="#eee"
            stroke-width="20"
          />
          <text x="10" y="115" font-size="8" fill="#999">0</text>
          <text x="175" y="115" font-size="8" fill="#999">1023</text>
          <line
            id="needle-limit"
            x1="100"
            y1="100"
            x2="100"
            y2="40"
            transform="rotate(-90)"
          />
          <line
            id="needle-moisture"
            x1="100"
            y1="100"
            x2="100"
            y2="30"
            transform="rotate(-90)"
          />
          <circle cx="100" cy="100" r="4" fill="#444" />
        </svg>
      </div>
    </div>

    <div class="window">
      <h3>Graf Vývoja</h3>
      <canvas id="liveChart"></canvas>

      <div class="btn-container">
        <button id="btn-start" onclick="startMonitoring()">
          Spustiť Monitoring
        </button>
        <button id="btn-stop" onclick="stopMonitoring()">
          Zastaviť Monitoring
        </button>
      </div>
    </div>

    <script>
      let monitorInterval = null; // Variable to store the timer

      const ctx = document.getElementById("liveChart").getContext("2d");
      const chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: [],
          datasets: [
            {
              label: "Vlhkosť pôdy",
              data: [],
              borderColor: "#007bff",
              tension: 0.3,
              fill: false,
            },
            {
              label: "Regulačný limit",
              data: [],
              borderColor: "#dc3545",
              borderDash: [5, 5],
              pointRadius: 0,
              tension: 0,
              fill: false,
            },
          ],
        },
        options: {
          animation: false,
          scales: { y: { beginAtZero: true, max: 1023 } },
        },
      });

      function updateLimit() {
        const val = document.getElementById("limit-input").value;
        fetch("/set_limit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ limit: val }),
        });
      }

      function startMonitoring() {
        if (monitorInterval) return; // Don't start if already running

        // Start the timer (1 second)
        monitorInterval = setInterval(fetchData, 1000);

        // UI Changes
        document.getElementById("btn-start").style.display = "none";
        document.getElementById("btn-stop").style.display = "block";
      }

      function stopMonitoring() {
        // Stop the timer
        clearInterval(monitorInterval);
        monitorInterval = null;

        // UI Changes
        document.getElementById("btn-start").style.display = "block";
        document.getElementById("btn-stop").style.display = "none";
      }

      function fetchData() {
        fetch("/get_data")
          .then((r) => r.json())
          .then((data) => {
            document.getElementById("pump-status").innerText = data.pump;
            document.getElementById("pump-status").className =
              data.pump === "ON" ? "status-on" : "status-off";

            const mDeg = (data.moisture / 1023) * 180 - 90;
            const lDeg = (data.limit / 1023) * 180 - 90;
            document.getElementById("needle-moisture").style.transform =
              `rotate(${mDeg}deg)`;
            document.getElementById("needle-limit").style.transform =
              `rotate(${lDeg}deg)`;

            const now = new Date().toLocaleTimeString();
            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(data.moisture);
            chart.data.datasets[1].data.push(data.limit);

            if (chart.data.labels.length > 20) {
              chart.data.labels.shift();
              chart.data.datasets[0].data.shift();
              chart.data.datasets[1].data.shift();
            }
            chart.update();
          });
      }
    </script>
  </body>
</html>
