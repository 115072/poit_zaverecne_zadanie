<!doctype html>
<html>
  <head>
    <title>Garden Dashboard TXT/DB</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: sans-serif;
        background: #f0f2f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      .window {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin: 10px;
        width: 95%;
        max-width: 600px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      #needle-moisture {
        transition: transform 0.5s;
        transform-origin: 100px 100px;
        stroke: blue;
        stroke-width: 4;
      }
      #needle-limit {
        transition: transform 0.5s;
        transform-origin: 100px 100px;
        stroke: red;
        stroke-width: 2;
        stroke-dasharray: 4;
      }
      .btn-start {
        background: #28a745;
        color: white;
        padding: 12px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
      }
      .btn-stop {
        background: #dc3545;
        color: white;
        padding: 12px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
        display: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 11px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 5px;
        text-align: left;
      }
      select {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <h3>Nastavenia</h3>
      Limit: <input type="number" id="limit-input" value="500" />
      <button onclick="updateLimit()">Uložiť</button>
      <p>Pumpa: <span id="pump-status">--</span></p>
    </div>

    <div class="window">
      <h3>Tachometer</h3>
      <svg viewBox="0 0 200 120" width="300">
        <path
          d="M20,100 A80,80 0 0,1 180,100"
          fill="none"
          stroke="#ccc"
          stroke-width="20"
        />
        <line
          id="needle-limit"
          x1="100"
          y1="100"
          x2="100"
          y2="40"
          transform="rotate(-90)"
        />
        <line
          id="needle-moisture"
          x1="100"
          y1="100"
          x2="100"
          y2="30"
          transform="rotate(-90)"
        />
      </svg>
    </div>

    <div class="window">
      <h3>Live Graf</h3>
      <canvas id="liveChart" height="150"></canvas>
      <button id="startBtn" class="btn-start" onclick="toggleMonitoring(true)">
        Štart Monitoring
      </button>
      <button id="stopBtn" class="btn-stop" onclick="toggleMonitoring(false)">
        Zastaviť Monitoring
      </button>
    </div>

    <!-- WINDOW 4: MYSQL -->
    <div class="window">
      <h3>História z MySQL Databázy</h3>
      <button onclick="loadSessions()">Obnoviť MySQL</button>
      <select id="sessionSelect" onchange="loadSessionDetails()"></select>
      <table id="historyTable">
        <thead>
          <tr>
            <th>Čas</th>
            <th>Vlhkosť</th>
            <th>Pumpa</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- WINDOW 5: TXT FILE -->
    <div class="window">
      <h3>História z .txt súboru (JSON riadky)</h3>
      <button onclick="loadTxtSessions()">Obnoviť .txt zoznam</button>
      <select id="txtSelect" onchange="loadTxtDetail()"></select>
      <table id="txtTable">
        <thead>
          <tr>
            <th>Čas</th>
            <th>Vlhkosť</th>
            <th>Pumpa</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      let liveInterval = null;
      const ctx = document.getElementById("liveChart").getContext("2d");
      const chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: [],
          datasets: [
            { label: "Vlhkosť", data: [], borderColor: "blue", tension: 0.3 },
            {
              label: "Limit",
              data: [],
              borderColor: "red",
              borderDash: [5, 5],
              pointRadius: 0,
            },
          ],
        },
        options: { animation: false, scales: { y: { min: 0, max: 1023 } } },
      });

      function updateLimit() {
        fetch("/set_limit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            limit: document.getElementById("limit-input").value,
          }),
        });
      }

      function toggleMonitoring(start) {
        const url = start ? "/start_monitoring" : "/stop_monitoring";
        fetch(url, { method: "POST" }).then(() => {
          if (start) {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("stopBtn").style.display = "block";
            liveInterval = setInterval(fetchLive, 1000);
          } else {
            document.getElementById("startBtn").style.display = "block";
            document.getElementById("stopBtn").style.display = "none";
            clearInterval(liveInterval);
            loadSessions();
            loadTxtSessions();
          }
        });
      }

      function fetchLive() {
        fetch("/get_data")
          .then((r) => r.json())
          .then((data) => {
            document.getElementById("pump-status").innerText = data.pump;
            const mDeg = (data.moisture / 1023) * 180 - 90;
            const lDeg = (data.limit / 1023) * 180 - 90;
            document.getElementById("needle-moisture").style.transform =
              `rotate(${mDeg}deg)`;
            document.getElementById("needle-limit").style.transform =
              `rotate(${lDeg}deg)`;
            const now = new Date().toLocaleTimeString();
            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(data.moisture);
            chart.data.datasets[1].data.push(data.limit);
            if (chart.data.labels.length > 20) {
              chart.data.labels.shift();
              chart.data.datasets[0].data.shift();
              chart.data.datasets[1].data.shift();
            }
            chart.update();
          });
      }

      // --- MYSQL HELPERS ---
      function loadSessions() {
        fetch("/list_sessions")
          .then((r) => r.json())
          .then((data) => {
            const sel = document.getElementById("sessionSelect");
            sel.innerHTML =
              '<option value="">-- Vyberte MySQL sedenie --</option>';
            data.forEach((s) => {
              sel.innerHTML += `<option value="${s.id}">ID: ${s.id} | ${s.start_time}</option>`;
            });
          });
      }
      function loadSessionDetails() {
        const sid = document.getElementById("sessionSelect").value;
        fetch("/get_session_details/" + sid)
          .then((r) => r.json())
          .then((data) => {
            const tbody = document.querySelector("#historyTable tbody");
            tbody.innerHTML = "";
            data.forEach((row) => {
              tbody.innerHTML += `<tr><td>${row.timestamp}</td><td>${row.moisture}</td><td>${row.pump_state}</td></tr>`;
            });
          });
      }

      // --- TXT HELPERS ---
      function loadTxtSessions() {
        fetch("/list_txt_sessions")
          .then((r) => r.json())
          .then((data) => {
            const sel = document.getElementById("txtSelect");
            sel.innerHTML =
              '<option value="">-- Vyberte riadok z TXT --</option>';
            data.forEach((s) => {
              sel.innerHTML += `<option value="${s.index}">Riadok ${s.index} (Sedenie ${s.id}) - ${s.date}</option>`;
            });
          });
      }
      function loadTxtDetail() {
        const idx = document.getElementById("txtSelect").value;
        fetch("/get_txt_detail/" + idx)
          .then((r) => r.json())
          .then((data) => {
            const tbody = document.querySelector("#txtTable tbody");
            tbody.innerHTML = "";
            data.readings.forEach((row) => {
              tbody.innerHTML += `<tr><td>${row.timestamp}</td><td>${row.moisture}</td><td>${row.pump}</td></tr>`;
            });
          });
      }

      window.onload = function () {
        loadSessions();
        loadTxtSessions();
      };
    </script>
  </body>
</html>
