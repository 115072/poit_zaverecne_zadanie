<!doctype html>
<html>
  <head>
    <title>Garden Dashboard - Multi-Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: sans-serif;
        background: #f0f2f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      .window {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin: 10px;
        width: 95%;
        max-width: 700px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      #needle-moisture {
        transition: transform 0.5s;
        transform-origin: 100px 100px;
        stroke: blue;
        stroke-width: 4;
      }
      #needle-limit {
        transition: transform 0.5s;
        transform-origin: 100px 100px;
        stroke: red;
        stroke-width: 2;
        stroke-dasharray: 4;
      }
      .btn-pwr {
        background: #007bff;
        color: white;
        padding: 15px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
        font-weight: bold;
      }
      .btn-start {
        background: #28a745;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
      }
      .btn-stop {
        background: #dc3545;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
        display: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 5px;
        text-align: left;
      }
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div class="window" style="background: #e3f2fd">
      <h2 id="hw-status">Hardvér: VYPNUTÝ</h2>
      <button id="pwrBtn" class="btn-pwr" onclick="toggleHW()">
        AKTIVOVAŤ HARDVÉR
      </button>
    </div>

    <!-- LIVE WINDOW -->
    <div class="window">
      <h3>Live Monitoring</h3>
      Limit: <input type="number" id="limit-input" value="500" />
      <button onclick="updateLimit()">Uložiť</button>
      <p>Moisture: <b id="m-val">0</b> | Pump: <b id="p-stat">OFF</b></p>
      <canvas id="liveChart" height="120"></canvas>
      <svg viewBox="0 0 200 120" width="150">
        <path
          d="M20,100 A80,80 0 0,1 180,100"
          fill="none"
          stroke="#ccc"
          stroke-width="20"
        />
        <line
          id="needle-limit"
          x1="100"
          y1="100"
          x2="100"
          y2="40"
          transform="rotate(-90)"
        />
        <line
          id="needle-moisture"
          x1="100"
          y1="100"
          x2="100"
          y2="30"
          transform="rotate(-90)"
        />
      </svg>
      <br />
      <button id="startBtn" class="btn-start" onclick="toggleMon(true)">
        Spustiť Monitoring
      </button>
      <button id="stopBtn" class="btn-stop" onclick="toggleMon(false)">
        Zastaviť Monitoring
      </button>
    </div>

    <!-- MYSQL HISTORY WINDOW -->
    <div class="window" style="border-left: 5px solid #007bff">
      <h3>História: MySQL Databáza</h3>
      <button onclick="loadSQL()">Obnoviť Zoznam</button>
      <select id="sqlSel" onchange="loadSQLDetail()"></select>
      <canvas id="sqlChart" height="120"></canvas>
      <table id="sqlTab">
        <thead>
          <tr>
            <th>Čas</th>
            <th>Vlhkosť</th>
            <th>Limit</th>
            <th>Pumpa</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- TXT HISTORY WINDOW -->
    <div class="window" style="border-left: 5px solid #6c757d">
      <h3>História: .txt Súbor</h3>
      <button onclick="loadTXT()">Obnoviť Zoznam</button>
      <select id="txtSel" onchange="loadTXTDetail()"></select>
      <canvas id="txtChart" height="120"></canvas>
      <table id="txtTab">
        <thead>
          <tr>
            <th>Čas</th>
            <th>Vlhkosť</th>
            <th>Limit</th>
            <th>Pumpa</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      let hwActive = false;

      // --- CHART GENERATOR HELPER ---
      function createChart(id, label) {
        return new Chart(document.getElementById(id).getContext("2d"), {
          type: "line",
          data: {
            labels: [],
            datasets: [
              { label: "Vlhkosť", data: [], borderColor: "blue", tension: 0.3 },
              {
                label: "Limit",
                data: [],
                borderColor: "red",
                borderDash: [5, 5],
                pointRadius: 0,
              },
            ],
          },
          options: { animation: false, scales: { y: { min: 0, max: 1023 } } },
        });
      }

      const liveChart = createChart("liveChart");
      const sqlChart = createChart("sqlChart");
      const txtChart = createChart("txtChart");

      function toggleHW() {
        hwActive = !hwActive;
        fetch("/toggle_hardware", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: hwActive }),
        });
        document.getElementById("pwrBtn").innerText = hwActive
          ? "DEAKTIVOVAŤ HARDVÉR"
          : "AKTIVOVAŤ HARDVÉR";
        document.getElementById("hw-status").innerText = hwActive
          ? "Hardvér: AKTÍVNY"
          : "Hardvér: VYPNUTÝ";
        if (hwActive) setInterval(fetchLive, 1000);
        else location.reload();
      }

      function fetchLive() {
        fetch("/get_data")
          .then((r) => r.json())
          .then((data) => {
            document.getElementById("m-val").innerText = data.moisture;
            document.getElementById("p-stat").innerText = data.pump;
            document.getElementById("needle-moisture").style.transform =
              `rotate(${(data.moisture / 1023) * 180 - 90}deg)`;
            document.getElementById("needle-limit").style.transform =
              `rotate(${(data.limit / 1023) * 180 - 90}deg)`;

            updateGraph(
              liveChart,
              new Date().toLocaleTimeString(),
              data.moisture,
              data.limit,
              true,
            );
          });
      }

      function updateGraph(chartObj, label, m, l, isLive) {
        chartObj.data.labels.push(label);
        chartObj.data.datasets[0].data.push(m);
        chartObj.data.datasets[1].data.push(l);
        if (isLive && chartObj.data.labels.length > 20) {
          chartObj.data.labels.shift();
          chartObj.data.datasets[0].data.shift();
          chartObj.data.datasets[1].data.shift();
        }
        chartObj.update();
      }

      // --- MYSQL LOADING ---
      function loadSQL() {
        fetch("/list_sessions")
          .then((r) => r.json())
          .then((data) => {
            let s = document.getElementById("sqlSel");
            s.innerHTML = "<option>-- Vyberte MySQL Sedenie --</option>";
            data.forEach((x) => {
              s.innerHTML += `<option value="${x.id}">ID: ${x.id} | ${x.start_time}</option>`;
            });
          });
      }

      function loadSQLDetail() {
        fetch("/get_session_details/" + document.getElementById("sqlSel").value)
          .then((r) => r.json())
          .then((data) => {
            let b = document.querySelector("#sqlTab tbody");
            b.innerHTML = "";
            sqlChart.data.labels = [];
            sqlChart.data.datasets[0].data = [];
            sqlChart.data.datasets[1].data = [];
            data.forEach((r) => {
              b.innerHTML += `<tr><td>${r.timestamp}</td><td>${r.moisture}</td><td>${r.reg_limit}</td><td>${r.pump_state}</td></tr>`;
              updateGraph(
                sqlChart,
                r.timestamp,
                r.moisture,
                r.reg_limit,
                false,
              );
            });
          });
      }

      // --- TXT LOADING ---
      function loadTXT() {
        fetch("/list_txt_sessions")
          .then((r) => r.json())
          .then((data) => {
            let s = document.getElementById("txtSel");
            s.innerHTML = "<option>-- Vyberte TXT Riadok --</option>";
            data.forEach((x) => {
              s.innerHTML += `<option value="${x.index}">Riadok ${x.index} | ${x.date}</option>`;
            });
          });
      }

      function loadTXTDetail() {
        fetch("/get_txt_detail/" + document.getElementById("txtSel").value)
          .then((r) => r.json())
          .then((data) => {
            let b = document.querySelector("#txtTab tbody");
            b.innerHTML = "";
            txtChart.data.labels = [];
            txtChart.data.datasets[0].data = [];
            txtChart.data.datasets[1].data = [];
            data.readings.forEach((r) => {
              b.innerHTML += `<tr><td>${r.timestamp}</td><td>${r.moisture}</td><td>${r.limit}</td><td>${r.pump}</td></tr>`;
              updateGraph(txtChart, r.timestamp, r.moisture, r.limit, false);
            });
          });
      }

      function toggleMon(s) {
        fetch(s ? "/start_monitoring" : "/stop_monitoring", {
          method: "POST",
        }).then(() => {
          document.getElementById("startBtn").style.display = s
            ? "none"
            : "block";
          document.getElementById("stopBtn").style.display = s
            ? "block"
            : "none";
        });
      }
      function updateLimit() {
        fetch("/set_limit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            limit: document.getElementById("limit-input").value,
          }),
        });
      }
      window.onload = () => {
        loadSQL();
        loadTXT();
      };
    </script>
  </body>
</html>
