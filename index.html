<!doctype html>
<html>
  <head>
    <title>Garden Dashboard - Professional Gauge</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f2f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      .window {
        background: white;
        border-radius: 12px;
        padding: 25px;
        margin: 10px;
        width: 95%;
        max-width: 800px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      /* GAUGE STYLING */
      .gauge-container {
        margin: 30px auto;
        position: relative;
        width: 100%;
        max-width: 500px;
      }
      #needle-moisture {
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        transform-origin: 100px 100px;
        stroke: #007bff;
        stroke-width: 4;
        stroke-linecap: round;
      }
      #needle-limit {
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        transform-origin: 100px 100px;
        stroke: #dc3545;
        stroke-width: 3;
        stroke-dasharray: 4;
        stroke-linecap: round;
      }
      .gauge-text {
        font-size: 8px;
        fill: #666;
        font-weight: bold;
      }
      .gauge-tick {
        stroke: #bbb;
        stroke-width: 1;
      }

      /* BUTTONS & UI */
      .btn-pwr {
        background: #007bff;
        color: white;
        padding: 15px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
        font-weight: bold;
        font-size: 18px;
      }
      .btn-start {
        background: #28a745;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
        font-weight: bold;
      }
      .btn-stop {
        background: #dc3545;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
        font-weight: bold;
        display: none;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 15px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      select {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
      }
      input[type="number"] {
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
        width: 80px;
      }
    </style>
  </head>
  <body>
    <!-- 1. POWER SWITCH -->
    <div class="window" style="background: #e3f2fd; border: 2px solid #007bff">
      <h2 id="hw-status" style="color: #007bff; margin-bottom: 15px">
        Hardvér: VYPNUTÝ
      </h2>
      <button id="pwrBtn" class="btn-pwr" onclick="toggleHW()">
        AKTIVOVAŤ HARDVÉR
      </button>
    </div>

    <!-- 2. LIVE DASHBOARD -->
    <div class="window">
      <h3>Live Monitoring & Kontrola</h3>
      <div style="margin-bottom: 20px">
        Limit: <input type="number" id="limit-input" value="500" />
        <button
          onclick="updateLimit()"
          style="
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
          "
        >
          Uložiť
        </button>
      </div>

      <p style="font-size: 18px">
        Moisture: <b id="m-val" style="color: #007bff">0</b> | Pump:
        <b id="p-stat">OFF</b>
      </p>

      <!-- LARGE GAUGE -->
      <div class="gauge-container">
        <svg viewBox="0 0 200 130" width="100%">
          <!-- Background Arc -->
          <path
            d="M20,100 A80,80 0 0,1 180,100"
            fill="none"
            stroke="#e9ecef"
            stroke-width="20"
          />

          <!-- Ticks and Numbers -->
          <!-- 0 -->
          <line class="gauge-tick" x1="20" y1="100" x2="30" y2="100" />
          <text class="gauge-text" x="10" y="105">0</text>

          <!-- 250 -->
          <line class="gauge-tick" x1="44" y1="44" x2="52" y2="52" />
          <text class="gauge-text" x="35" y="40">250</text>

          <!-- 500 -->
          <line class="gauge-tick" x1="100" y1="20" x2="100" y2="30" />
          <text class="gauge-text" x="92" y="15">500</text>

          <!-- 750 -->
          <line class="gauge-tick" x1="156" y1="44" x2="148" y2="52" />
          <text class="gauge-text" x="155" y="40">750</text>

          <!-- 1023 -->
          <line class="gauge-tick" x1="170" y1="100" x2="180" y2="100" />
          <text class="gauge-text" x="175" y="105">1023</text>

          <!-- Needles -->
          <line
            id="needle-limit"
            x1="100"
            y1="100"
            x2="100"
            y2="40"
            transform="rotate(-90)"
          />
          <line
            id="needle-moisture"
            x1="100"
            y1="100"
            x2="100"
            y2="30"
            transform="rotate(-90)"
          />

          <!-- Center point -->
          <circle cx="100" cy="100" r="5" fill="#343a40" />
        </svg>
        <div style="font-size: 12px; margin-top: 10px">
          <span style="color: #007bff">● Aktuálna Vlhkosť</span>
          <span style="color: #dc3545; margin-left: 20px"
            >● Nastavený Limit (Dashed)</span
          >
        </div>
      </div>

      <canvas id="liveChart" height="120"></canvas>
      <br />
      <button
        id="startBtn"
        class="btn-start"
        onclick="toggleMon(true)"
        style="margin-top: 15px"
      >
        Spustiť Monitoring (Ukladanie)
      </button>
      <button
        id="stopBtn"
        class="btn-stop"
        onclick="toggleMon(false)"
        style="margin-top: 15px"
      >
        Zastaviť Monitoring
      </button>
    </div>

    <!-- 3. MYSQL HISTORY -->
    <div class="window" style="border-left: 6px solid #007bff">
      <h3>História: MySQL Databáza</h3>
      <button onclick="loadSQL()">Obnoviť MySQL</button>
      <select id="sqlSel" onchange="loadSQLDetail()"></select>
      <canvas id="sqlChart" height="120"></canvas>
      <table id="sqlTab">
        <thead>
          <tr>
            <th>Čas</th>
            <th>Vlhkosť</th>
            <th>Limit</th>
            <th>Pumpa</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 4. TXT HISTORY -->
    <div class="window" style="border-left: 6px solid #6c757d">
      <h3>História: .txt Súbor</h3>
      <button onclick="loadTXT()">Obnoviť .txt</button>
      <select id="txtSel" onchange="loadTXTDetail()"></select>
      <canvas id="txtChart" height="120"></canvas>
      <table id="txtTab">
        <thead>
          <tr>
            <th>Čas</th>
            <th>Vlhkosť</th>
            <th>Limit</th>
            <th>Pumpa</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      let hwActive = false;

      // --- CHART GENERATOR HELPER ---
      function createChart(id) {
        return new Chart(document.getElementById(id).getContext("2d"), {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Vlhkosť",
                data: [],
                borderColor: "#007bff",
                tension: 0.3,
                fill: false,
              },
              {
                label: "Limit",
                data: [],
                borderColor: "#dc3545",
                borderDash: [5, 5],
                pointRadius: 0,
                fill: false,
              },
            ],
          },
          options: { animation: false, scales: { y: { min: 0, max: 1023 } } },
        });
      }

      const liveChart = createChart("liveChart");
      const sqlChart = createChart("sqlChart");
      const txtChart = createChart("txtChart");

      function toggleHW() {
        hwActive = !hwActive;
        fetch("/toggle_hardware", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: hwActive }),
        });
        document.getElementById("pwrBtn").innerText = hwActive
          ? "DEAKTIVOVAŤ HARDVÉR"
          : "AKTIVOVAŤ HARDVÉR";
        document.getElementById("hw-status").innerText = hwActive
          ? "Hardvér: AKTÍVNY"
          : "Hardvér: VYPNUTÝ";
        if (hwActive) setInterval(fetchLive, 1000);
        else location.reload();
      }

      function fetchLive() {
        fetch("/get_data")
          .then((r) => r.json())
          .then((data) => {
            document.getElementById("m-val").innerText = data.moisture;
            document.getElementById("p-stat").innerText = data.pump;
            document.getElementById("p-stat").style.color =
              data.pump === "ON" ? "red" : "green";

            // Update Large Gauge Needles
            const mDeg = (data.moisture / 1023) * 180 - 90;
            const lDeg = (data.limit / 1023) * 180 - 90;
            document.getElementById("needle-moisture").style.transform =
              `rotate(${mDeg}deg)`;
            document.getElementById("needle-limit").style.transform =
              `rotate(${lDeg}deg)`;

            // Update Live Graph
            updateGraph(
              liveChart,
              new Date().toLocaleTimeString(),
              data.moisture,
              data.limit,
              true,
            );
          });
      }

      function updateGraph(chartObj, label, m, l, isLive) {
        chartObj.data.labels.push(label);
        chartObj.data.datasets[0].data.push(m);
        chartObj.data.datasets[1].data.push(l);
        if (isLive && chartObj.data.labels.length > 20) {
          chartObj.data.labels.shift();
          chartObj.data.datasets[0].data.shift();
          chartObj.data.datasets[1].data.shift();
        }
        chartObj.update();
      }

      // --- DATA LOADING ---
      function loadSQL() {
        fetch("/list_sessions")
          .then((r) => r.json())
          .then((data) => {
            let s = document.getElementById("sqlSel");
            s.innerHTML = "<option>-- Vyberte MySQL Sedenie --</option>";
            data.forEach((x) => {
              s.innerHTML += `<option value="${x.id}">Sedenie ID: ${x.id} | ${x.start_time}</option>`;
            });
          });
      }

      function loadSQLDetail() {
        fetch("/get_session_details/" + document.getElementById("sqlSel").value)
          .then((r) => r.json())
          .then((data) => {
            let b = document.querySelector("#sqlTab tbody");
            b.innerHTML = "";
            sqlChart.data.labels = [];
            sqlChart.data.datasets[0].data = [];
            sqlChart.data.datasets[1].data = [];
            data.forEach((r) => {
              b.innerHTML += `<tr><td>${r.timestamp}</td><td>${r.moisture}</td><td>${r.reg_limit}</td><td>${r.pump_state}</td></tr>`;
              updateGraph(
                sqlChart,
                r.timestamp,
                r.moisture,
                r.reg_limit,
                false,
              );
            });
          });
      }

      function loadTXT() {
        fetch("/list_txt_sessions")
          .then((r) => r.json())
          .then((data) => {
            let s = document.getElementById("txtSel");
            s.innerHTML = "<option>-- Vyberte TXT Riadok --</option>";
            data.forEach((x) => {
              s.innerHTML += `<option value="${x.index}">Riadok ${x.index} | ${x.date}</option>`;
            });
          });
      }

      function loadTXTDetail() {
        fetch("/get_txt_detail/" + document.getElementById("txtSel").value)
          .then((r) => r.json())
          .then((data) => {
            let b = document.querySelector("#txtTab tbody");
            b.innerHTML = "";
            txtChart.data.labels = [];
            txtChart.data.datasets[0].data = [];
            txtChart.data.datasets[1].data = [];
            data.readings.forEach((r) => {
              b.innerHTML += `<tr><td>${r.timestamp}</td><td>${r.moisture}</td><td>${r.limit}</td><td>${r.pump}</td></tr>`;
              updateGraph(txtChart, r.timestamp, r.moisture, r.limit, false);
            });
          });
      }

      function toggleMon(s) {
        fetch(s ? "/start_monitoring" : "/stop_monitoring", {
          method: "POST",
        }).then(() => {
          document.getElementById("startBtn").style.display = s
            ? "none"
            : "block";
          document.getElementById("stopBtn").style.display = s
            ? "block"
            : "none";
        });
      }
      function updateLimit() {
        fetch("/set_limit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            limit: document.getElementById("limit-input").value,
          }),
        });
      }
      window.onload = () => {
        loadSQL();
        loadTXT();
      };
    </script>
  </body>
</html>
